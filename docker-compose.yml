# Expense Tracker — full stack
# Run: docker compose up -d
# Open: http://localhost:8080 (UI), http://localhost:8000 (API docs)
# Optional Telegram bot: set TELEGRAM_BOT_TOKEN and run with bot service.

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8000:8000"
    volumes:
      - expense_data:/app/database
    environment:
      - EXPENSE_DEFAULT_USER_ID=local
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_EXPENSE_API_URL: http://localhost:8000
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy

  # Optional: run only if TELEGRAM_BOT_TOKEN is set
  # docker compose --profile bot up -d
  bot:
    build:
      context: .
      dockerfile: Dockerfile.backend
    command: ["python", "telegram_bot.py"]
    environment:
      - EXPENSE_API_URL=http://backend:8000
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
    depends_on:
      backend:
        condition: service_healthy
    profiles:
      - bot

volumes:
  expense_data:
